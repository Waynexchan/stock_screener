[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = ["arg-type", "return-value", "call-overload"]
exclude = ["test_.*\\.py", "tests/"]

[[tool.mypy.overrides]]
module = ["run_screener", "ai_analysis", "send_email"]
ignore_errors = true
